name: Publish GameNight preview
on:
  workflow_run:
    workflows: [Windows package]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  upload:
    if: vars.GAMENIGHT_PUBLISH_ENABLED == 'true'
    uses: ontola/gamenight/.github/workflows/publish-game.yml@main
    secrets: inherit
    with:
      artifact: mineclonia-windows-candidate
      game: mineclonia
      file: mineclonia-windows.zip
      entrypoint: Mineclonia.exe
